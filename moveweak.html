<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title id="pageTitleTag">이동약자 안전 지도</title>


<style>
body {
    font-family: 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f5f6f7;
}


.header-bar {
    width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}


.back-btn {
    background-color: #6c757d;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}


.back-btn:hover {
    background-color: #5a6268;
}


#map {
    width: 800px;
    height: 550px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}


/* 범례 */
.legend {
    width: 800px;
    margin-top: 15px;
    background-color: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}


.legend h3 {
    margin-top: 0;
    margin-bottom: 12px;
}


.legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}


.legend-item img {
    width: 32px;
    height: 32px;
    margin-right: 12px;
}


.legend-text {
    font-size: 15px;
    color: #333;
}


@media (max-width: 850px) {
    .header-bar,
    #map,
    .legend {
        width: 95%;
    }


    #map {
        height: 500px;
    }
}
</style>
</head>
<body>


<div class="header-bar">
    <h2 id="mapTitle">이동약자 안전 지도</h2>
    <button class="back-btn" id="homeBtn" onclick="location.href='index.html'">🏠 홈으로</button>
</div>


<div id="map"></div>


<div class="legend">
    <h3 id="legendTitle">📍 지도 마커 안내</h3>


    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <div class="legend-text" id="crowdHighText">👥 유동인구 많은 지역</div>
    </div>


    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png">
        <div class="legend-text" id="crowdLowText">🌿 유동인구 적은 지역</div>
    </div>


    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
        <div class="legend-text" id="accidentText">⚠️ 교통사고 다발구역</div>
    </div>


    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1048/1048362.png">
        <div class="legend-text" id="elevatorText">♿ 지하철 승강기 위치 및 가동 현황</div>
    </div>
</div>


<script src="language.js"></script>


<script>
function initMap() {
    const lang = localStorage.getItem("language") || "ko";
   
    const t = (window.translations && window.translations[lang]) ? window.translations[lang]["moveweak"] : {};


    const defaultCenter = { lat: 37.566535, lng: 126.977969 };
    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: defaultCenter,
    });


    const bounds = new google.maps.LatLngBounds();

    // ===== CSV 경사로/엘리베이터 데이터 =====
    const rampData = [
     { "name": "서울", "line": "1", "lat": 37.5547, "lng": 126.9706, "description": "<b>외부출입구</b>: #4, #9-1<br><b>외부E/V</b>: #2, #4<br><b>대합실</b>: 화장실, 환승통로<br><b>내부E/V</b>: #12" },
     { "name": "시청", "line": "1", "lat": 37.5653, "lng": 126.9772, "description": "<b>외부출입구</b>: #6<br><b>대합실</b>: 화장실, 환승통로<br><b>외부E/V</b>: #9" },
  // ... (아래 파일로 전달)
];

    const lineColors = { "1":"#0052A4","2":"#00A84D","3":"#EF7C1C","4":"#00A5DE","5":"#996CAC","6":"#CD7C2F","7":"#747F00","8":"#E6186C" };

    rampData.forEach(station => {
        const color = lineColors[station.line] || "#555";
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40"><path d="M16 0 C7.16 0 0 7.16 0 16 C0 28 16 40 16 40 C16 40 32 28 32 16 C32 7.16 24.84 0 16 0Z" fill="${color}"/><text x="16" y="22" text-anchor="middle" font-size="16" fill="white">♿</text></svg>`;
        const iconUrl = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svgIcon);

        const marker = new google.maps.Marker({
            position: { lat: station.lat, lng: station.lng },
            map: map,
            title: station.name + " (" + station.line + "호선)",
            icon: { url: iconUrl, scaledSize: new google.maps.Size(28, 35), anchor: new google.maps.Point(14, 35) }
    });

        const infowindow = new google.maps.InfoWindow({
            content: `<div style="padding:10px;max-width:220px;font-family:'Malgun Gothic',sans-serif;"><strong style="color:${color};">♿ ${station.name} (${station.line}호선)</strong><br><br><div style="font-size:13px;line-height:1.8;">${station.description}</div></div>`
    });

        marker.addListener("click", () => { infowindow.open(map, marker); });
        bounds.extend(marker.getPosition());
});
// ===== CSV 데이터 끝 =====


    if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    if (typeof applyLanguage === "function") {
        applyLanguage("moveweak");
    }
});
</script>


<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap">
</script>


</body>
</html>
