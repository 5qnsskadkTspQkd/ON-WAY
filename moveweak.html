<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitleTag">이동약자 안전 지도</title>

<style>
body {
    font-family: 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f5f6f7;
}

.header-bar {
    width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.back-btn {
    background-color: #6c757d;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.back-btn:hover {
    background-color: #5a6268;
}

#map {
    width: 800px;
    height: 550px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* 범례 */
.legend {
    width: 800px;
    margin-top: 15px;
    background-color: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.legend h3 {
    margin-top: 0;
    margin-bottom: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

.legend-item img {
    width: 32px;
    height: 32px;
    margin-right: 12px;
}

.legend-text {
    font-size: 15px;
    color: #333;
}

@media (max-width: 850px) {
    .header-bar,
    #map,
    .legend {
        width: 95%;
    }

    #map {
        height: 500px;
    }
}
</style>
</head>
<body>

<div class="header-bar">
    <h2 id="mapTitle">이동약자 안전 지도</h2>
    <button class="back-btn" id="homeBtn" onclick="location.href='index.html'">🏠 홈으로</button>
</div>

<div id="map"></div>

<div class="legend">
    <h3 id="legendTitle">📍 지도 마커 안내</h3>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <div class="legend-text" id="crowdHighText">👥 유동인구 많은 지역</div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png">
        <div class="legend-text" id="crowdLowText">🌿 유동인구 적은 지역</div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
        <div class="legend-text" id="accidentText">⚠️ 교통사고 다발구역</div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1048/1048362.png">
        <div class="legend-text" id="elevatorText">♿ 지하철 승강기 위치 및 가동 현황</div>
    </div>
</div>

<script src="language.js"></script>

<script>
function initMap() {
    const lang = localStorage.getItem("language") || "ko";
    
    const t = (window.translations && window.translations[lang]) ? window.translations[lang]["moveweak"] : {};

    const defaultCenter = { lat: 37.566535, lng: 126.977969 };
    const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 13,
        center: defaultCenter,
    });

    const bounds = new google.maps.LatLngBounds();

    // 맵 전역 구동 데이터 마커 설정
    const dataMarkers = [
        // 유동인구 많은곳
        {
            title: t.crowdMarker || "유동인구 밀집지역",
            lat: 37.4979,
            lng: 127.0276,
            icon: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
            description: t.crowdDesc || "인파가 혼잡하므로 이동 시 유의하세요."
        },
        // 유동인구 적은곳
        {
            title: t.quietMarker || "유동인구 적은 지역",
            lat: 37.5705,
            lng: 126.9832,
            icon: "https://cdn-icons-png.flaticon.com/512/1946/1946436.png",
            description: t.quietDesc || "인적이 드물어 한적한 보행로입니다."
        },
        // 교통사고 다발구역
        {
            title: t.accidentMarker || "교통사고 다발구역",
            lat: 37.5662,
            lng: 126.9820,
            icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png",
            description: t.accidentDesc || "교통사고 위험이 높아 주의가 필요합니다."
        },
        // 지하철 승강기
        {
            title: t.elevatorMarker1 || "지하철 승강기 A",
            lat: 37.5550,
            lng: 126.9700,
            icon: "https://cdn-icons-png.flaticon.com/512/1048/1048362.png",
            description: t.elevatorDesc || "지하철역 내부 교통약자용 승강기입니다."
        },
        {
            title: t.elevatorMarker2 || "지하철 승강기 B",
            lat: 37.5600,
            lng: 126.9750,
            icon: "https://cdn-icons-png.flaticon.com/512/1048/1048362.png",
            description: t.elevatorDesc || "지하철역 내부 교통약자용 승강기입니다."
        }
    ];

    dataMarkers.forEach(place => {
        const marker = new google.maps.Marker({
            position: { lat: place.lat, lng: place.lng },
            map: map,
            title: place.title,
            icon: {
                url: place.icon,
                scaledSize: new google.maps.Size(40, 40)
            }
        });

        const infowindow = new google.maps.InfoWindow({
            content: `
            <div style="padding:10px;">
                <strong>${place.title}</strong><br>
                ${place.description}
            </div>`
        });

        marker.addListener("click", () => {
            infowindow.open(map, marker);
        });

        bounds.extend(marker.getPosition());
    });

    if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
    }
}

// 브라우저 렌더링 완료 이후 다국어 매핑 적용
document.addEventListener("DOMContentLoaded", function() {
    if (typeof applyLanguage === "function") {
        applyLanguage("moveweak");
    }
});
</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap">
</script>

</body>
</html>
