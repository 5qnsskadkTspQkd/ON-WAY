<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>응급환자 안전 지도</title>


<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #f5f6f7;
}


.header-bar {
  width: 800px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}


.back-btn {
  background-color: #6c757d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}


#map {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}


.legend {
  width: 800px;
  margin-top: 15px;
  background: white;
  border-radius: 12px;
  padding: 15px;
}


.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}


.legend-item img {
  width: 32px;
  height: 32px;
  margin-right: 12px;
}
</style>
</head>


<body>


<div class="header-bar">
  <h2 id="mapTitle">응급환자 안전 지도</h2>
  <button class="back-btn" id="homeBtn" onclick="location.href='index.html'">🏠 홈으로</button>
</div>


<div id="map"></div>


<div class="legend">
  <h3 id="legendTitle">📍 지도 마커 안내</h3>


  <div class="legend-item">
    <img src="https://cdn-icons-png.flaticon.com/512/2776/2776067.png">
    <div id="fireText">🚒 소방서 및 안전센터</div>
  </div>


  <div class="legend-item">
    <img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">
    <div id="hospitalText">🏥 병원</div>
  </div>


  <div class="legend-item">
    <img src="https://cdn-icons-png.flaticon.com/512/2967/2967350.png">
    <div id="emergencyText">🚑 응급실</div>
  </div>
</div>


<script>
let fireMarkers = [];
let hospitalMarkers = [];


function initMap() {


  const map = new google.maps.Map(document.getElementById("map"), {
    zoom: 7,
    center: { lat: 36.5, lng: 127.8 }
  });


  const bounds = new google.maps.LatLngBounds();


  const lang = localStorage.getItem("language") || "ko";
  const t = translations[lang].moveweak;


  // 🔥 소방서
  fetch("https://api.odcloud.kr/api/15138232/v1/uddi:da0c6c93-f05a-453d-849f-e4c3697222e3?page=1&perPage=100&serviceKey=a26e5868693aaa5bb14e7ced5a1880e7e7a2eb60b86200cb76a2e85aba3aba1c")
  .then(res => res.json())
  .then(data => {


    data.data.forEach(p => {


      const lat = parseFloat(p["X좌표"]);
      const lng = parseFloat(p["Y좌표"]);


      if (isNaN(lat) || isNaN(lng)) return;


      const name = t.fireMarker || "Fire Station";


      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title: name,
        icon: {
          url: "https://cdn-icons-png.flaticon.com/512/2776/2776067.png",
          scaledSize: new google.maps.Size(40, 40)
        }
      });


      const infowindow = new google.maps.InfoWindow({
        content: `<div><strong>${name}</strong><br>${p["주소"] || ""}</div>`
      });


      marker.addListener("click", () => infowindow.open(map, marker));


      bounds.extend({ lat, lng });
      fireMarkers.push(marker);
    });


  });


  // 🏥 병원
  fetch("./hospital.xml")
  .then(res => res.text())
  .then(xmlText => {


    const xml = new DOMParser().parseFromString(xmlText, "text/xml");
    const rows = xml.querySelectorAll("row");


    rows.forEach(r => {


      const lat = parseFloat(r.querySelector("WGS84LAT")?.textContent);
      const lng = parseFloat(r.querySelector("WGS84LON")?.textContent);


      if (isNaN(lat) || isNaN(lng)) return;


      const name = r.querySelector("DUTYNAME")?.textContent || t.hospitalMarker;


      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title: name,
        icon: {
          url: "https://cdn-icons-png.flaticon.com/512/2785/2785482.png",
          scaledSize: new google.maps.Size(40, 40)
        }
      });


      const infowindow = new google.maps.InfoWindow({
        content: `<div><strong>${name}</strong></div>`
      });


      marker.addListener("click", () => infowindow.open(map, marker));


      bounds.extend({ lat, lng });
      hospitalMarkers.push(marker);
    });


  });


  if (!bounds.isEmpty()) map.fitBounds(bounds);
}
</script>


<script src="language.js"></script>
<script>
applyLanguage("moveweak");
</script>


<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap">
</script>


</body>
</html>
