<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>응급환자 안전 지도</title>

<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #f5f6f7;
}

.header-bar {
  width: 800px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.back-btn {
  background-color: #6c757d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.back-btn:hover {
  background-color: #5a6268;
}

#map {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

@media (max-width: 850px) {
  .header-bar,
  #map {
    width: 95%;
  }

  #map {
    height: 500px;
  }
}
</style>
</head>

<body>

<div class="header-bar">
  <h2 id="mapTitle">응급환자 안전 지도</h2>

  <button class="back-btn" onclick="location.href='index.html'">
    🏠 홈으로
  </button>
</div>

<div id="map"></div>

<script>
function initMap() {

  const defaultCenter = { lat: 36.5, lng: 127.8 };

  const map = new google.maps.Map(document.getElementById("map"), {
    zoom: 7,
    center: defaultCenter
  });

  const bounds = new google.maps.LatLngBounds();

  // ✅ 소방서 API
  const firePromise = fetch(
    "https://api.odcloud.kr/api/15138232/v1/uddi:da0c6c93-f05a-453d-849f-e4c3697222e3?page=1&perPage=100&serviceKey=a26e5868693aaa5bb14e7ced5a1880e7e7a2eb60b86200cb76a2e85aba3aba1c"
  )
  .then(res => res.json())
  .then(data => {

    data.data.forEach(place => {

      const lat = parseFloat(place["X좌표"]);
      const lng = parseFloat(place["Y좌표"]);

      const name = place["소방서 및 안전센터명"] || "소방서";

      if (isNaN(lat) || isNaN(lng)) return;

      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title: name,

        icon: {
          url: "https://cdn-icons-png.flaticon.com/512/2776/2776067.png",
          scaledSize: new google.maps.Size(40, 40)
        }
      });

      const infowindow = new google.maps.InfoWindow({
        content: `
          <div style="padding:10px;">
            <strong>🚒 ${name}</strong><br>
            ${place["주소"] || ""}
          </div>
        `
      });

      marker.addListener("click", () => {
        infowindow.open(map, marker);
      });

      bounds.extend({ lat, lng });
    });
  });

  // ✅ 서울시 병원 API (HTTPS로 수정 완료)
  const hospitalPromise = fetch("./hospital.xml")
    .then(res => res.text())
    .then(xmlText => {

    const parser = new DOMParser();

    const xml = parser.parseFromString(xmlText, "application/xml");

    const rows = xml.querySelectorAll("row");

    rows.forEach(row => {

      const lat = parseFloat(
        row.querySelector("WGS84LAT")?.textContent
      );

      const lng = parseFloat(
        row.querySelector("WGS84LON")?.textContent
      );

      const name =
        row.querySelector("DUTYNAME")?.textContent || "병원";

      const addr =
        row.querySelector("DUTYADDR")?.textContent || ""; 

      if (isNaN(lat) || isNaN(lng)) return;

      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title: name,

        icon: {
          url: "https://cdn-icons-png.flaticon.com/512/2785/2785482.png",
          scaledSize: new google.maps.Size(40, 40)
        }
      });

      const infowindow = new google.maps.InfoWindow({
        content: `
          <div style="padding:10px;">
            <strong>🏥 ${name}</strong><br>
            ${addr}
          </div>
        `
      });

      marker.addListener("click", () => {
        infowindow.open(map, marker);
      });

      bounds.extend({ lat, lng });
    });
  });

  // ✅ 둘 다 완료되면 지도 범위 자동 조절
  Promise.all([firePromise, hospitalPromise])
    .then(() => {

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }

    })
    .catch(err => {
      console.error("API 오류:", err);
    });
}
</script>

<!-- ✅ 구글 맵 API -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap">
</script>

<script src="language.js"></script>

<script>
applyLanguage("emergency");
</script>

</body>
</html>
