<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">노인 안전 지도</title>

<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #f5f6f7;
}

.header-bar {
  width: 800px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.back-btn {
  background-color: #6c757d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.back-btn:hover {
  background-color: #5a6268;
}

#map {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.map-wrapper {
  position: relative;
  width: 800px;
}

.loading-overlay {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  position: absolute;
  top: 0; left: 0;
  z-index: 10;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #eee;
  border-top-color: #e67e22;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text { color: #888; font-size: 14px; }

.legend {
  width: 800px;
  margin-top: 15px;
  background-color: white;
  border-radius: 12px;
  padding: 15px 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.legend h3 { margin-top: 0; margin-bottom: 12px; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.legend-item { display: flex; align-items: center; }
.legend-item img { width: 32px; height: 32px; margin-right: 12px; }
.legend-text { font-size: 15px; color: #333; }

.error-box {
  width: 800px;
  background: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #856404;
  margin-top: 10px;
  display: none;
}

@media (max-width: 850px) {
  .header-bar, .map-wrapper, #map, .legend, .error-box { width: 95%; }
  #map { height: 500px; }
  .loading-overlay { width: 100%; }
  .legend-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="header-bar">
  <h2 id="pageTitle">노인 안전 지도</h2>
  <button class="back-btn" id="homeBtn" onclick="location.href='index.html'">🏠 홈으로</button>
</div>

<div class="map-wrapper">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">데이터를 불러오는 중입니다...</div>
  </div>
  <div id="map"></div>
</div>

<div class="error-box" id="errorBox"></div>

<div class="legend">
  <h3 id="legendTitle">📍 지도 마커 안내</h3>
  <div class="legend-grid">
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/7096/7096518.png"><div class="legend-text" id="benchText">🪑 벤치·쉼터</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050451.png"><div class="legend-text" id="toiletText">🚻 화장실</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/4003/4003836.png"><div class="legend-text" id="flatroadText">🚶 평지 구간</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/2991/2991589.png"><div class="legend-text" id="elevatorText">🛗 지하철역 승강기</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/3209/3209158.png"><div class="legend-text" id="escalatorText">🔼 지하철역 에스컬레이터</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/2780/2780887.png"><div class="legend-text" id="rampText">♿ 휠체어 경사로</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png"><div class="legend-text" id="medicalText">🏥 의료복지시설</div></div>
    <div class="legend-item"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946429.png"><div class="legend-text" id="coolshelterText">☀️ 무더위쉼터</div></div>
  </div>
</div>

<script src="language.js"></script>
<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

<script>
window.ElderlyMapApp = {
  FILES: {
    bench:       "bench.csv",
    toilet:      "toilet_elder.csv",
    flatroad:    "flatroad.csv",
    elevator:    "elevator.csv",
    escalator:   "escalator.csv",
    ramp:        "ramp_elder.csv",
    medical:     "medical.csv",
    coolshelter: "coolshelter.xml" 
  },
  layerMarkers: {
    bench: [], toilet: [], flatroad: [], elevator: [],
    escalator: [], ramp: [], medical: [], coolshelter: []
  },
  googleMapInstance: null,
  loadedCount: 0,
  totalLayers: 8, 
  errors: [],
  ICONS: {}
};

function initMap() {
  const app = window.ElderlyMapApp;
  
  // 기존 원형 심볼 정의
  const makeCircle = (color) => ({
    path: google.maps.SymbolPath.CIRCLE,
    scale: 7,
    fillColor: color,
    fillOpacity: 0.88,
    strokeColor: "#fff",
    strokeWeight: 1.5
  });

  app.ICONS = {
    bench:       makeCircle("#ff8f00"),
    toilet:      makeCircle("#00838f"),
    flatroad:    makeCircle("#66bb6a"),
    elevator:    makeCircle("#1e88e5"),
    escalator:   makeCircle("#42a5f5"),
    ramp:        makeCircle("#7b9ed9"),
    medical:     makeCircle("#e53935")
  };

  app.googleMapInstance = new google.maps.Map(document.getElementById("map"), {
    zoom: 11,
    center: { lat: 37.5665, lng: 126.9780 },
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
  });
  
  loadAllLayers();
}

function loadAllLayers() {
  const app = window.ElderlyMapApp;
  updateLoadingText();

  const csvLayers = [
    { key: "bench",       icon: app.ICONS.bench,       emoji: "🪑", label: "벤치·쉼터" },
    { key: "toilet",      icon: app.ICONS.toilet,      emoji: "🚻", label: "화장실" },
    { key: "flatroad",    icon: app.ICONS.flatroad,    emoji: "🚶", label: "평지 구간" },
    { key: "elevator",    icon: app.ICONS.elevator,    emoji: "🛗", label: "지하철역 승강기" },
    { key: "escalator",   icon: app.ICONS.escalator,   emoji: "🔼", label: "지하철역 에스컬레이터" },
    { key: "ramp",        icon: app.ICONS.ramp,        emoji: "♿", label: "휠체어 경사로" },
    { key: "medical",     icon: app.ICONS.medical,     emoji: "🏥", label: "의료복지시설" }
  ];

  csvLayers.forEach(({ key, icon, emoji, label }) => {
    loadCSV(app.FILES[key], 
      (rows) => {
        rows.forEach(({ name, lat, lng }) => {
          // 기존 CSV용 구글 순정 마커 생성 라인
          const marker = new google.maps.Marker({
            position: { lat, lng },
            map: app.googleMapInstance,
            title: name,
            icon: icon
          });
          bindInfoWindow(marker, `<strong>${emoji} ${name}</strong><br><span style='color:#888'>${label}</span>`);
          app.layerMarkers[key].push(marker);
        });
      }, 
      () => { layerDone(label); }, 
      (url) => { app.errors.push(url); layerDone(url); }
    );
  });

  // 무더위쉼터 XML 로더 기동
  loadLocalXMLShelter();
}

// [핵심 수정] 요청하신 코드 방식대로 외부 이미지 주소와 크기를 제어하는 XML 전용 마커 빌더
function loadLocalXMLShelter() {
  const app = window.ElderlyMapApp;
  const xmlFileUrl = app.FILES.coolshelter;

  fetch(xmlFileUrl)
    .then(res => {
      if (!res.ok) throw new Error(xmlFileUrl);
      return res.text();
    })
    .then(xmlText => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      
      let rows = xmlDoc.getElementsByTagName("row");
      if (rows.length === 0) rows = xmlDoc.getElementsByTagName("ROW");

      for (let i = 0; i < rows.length; i++) {
        const rowNode = rows[i];
        
        // 새로 지정한 SftcltrShelter API 규격 태그 파싱 (위도: LA, 경도: LO, 시설명: NAME)
        const latText = rowNode.getElementsByTagName("LAT")[0]?.textContent;
const lngText = rowNode.getElementsByTagName("LON")[0]?.textContent;
const nameText = rowNode.getElementsByTagName("R_AREA_NM")[0]?.textContent || "무더위쉼터";
const addrText = rowNode.getElementsByTagName("R_DETL_ADD")[0]?.textContent || "";
        const lat = parseFloat(latText);
        const lng = parseFloat(lngText);

        if (!isNaN(lat) && !isNaN(lng)) {
          // ★ 요청하신 구글 맵스 마커 인스턴스 생성 방식 완벽 적용 ★
          const marker = new google.maps.Marker({
            position: { lat, lng },
            map: app.googleMapInstance,
            title: nameText.trim(),
            icon: {
              url: "https://cdn-icons-png.flaticon.com/512/1946/1946429.png", // 무더위쉼터 태양 집 아이콘
              scaledSize: new google.maps.Size(32, 32) // 깔끔한 표출을 위해 32x32 크기 지정
            }
          });

          bindInfoWindow(marker, `<strong>☀️ ${nameText.trim()}</strong><br><span style='color:#666; font-size:12px;'>${addrText.trim()}</span>`);
          app.layerMarkers.coolshelter.push(marker);
        }
      }
      layerDone("무더위쉼터");
    })
    .catch(err => {
      console.warn("XML 로드 실패:", err);
      app.errors.push(xmlFileUrl);
      layerDone("무더위쉼터");
    });
}

function loadCSV(url, onChunkSuccess, onComplete, onError) {
  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error(url);
      return res.text();
    })
    .then(text => {
      const rows = text.trim().split("\n").slice(1);
      const parsed = [];
      for (const row of rows) {
        const cols = row.split(",");
        if (cols.length < 3) continue;
        const lat = parseFloat(cols[1]);
        const lng = parseFloat(cols[2]);
        if (isNaN(lat) || isNaN(lng)) continue;
        parsed.push({ name: cols[0].trim(), lat, lng });
      }
      const CHUNK = 2000;
      let idx = 0;
      function next() {
        onChunkSuccess(parsed.slice(idx, idx + CHUNK));
        idx += CHUNK;
        if (idx < parsed.length) setTimeout(next, 0);
        else onComplete();
      }
      next();
    })
    .catch(err => { console.warn(err); onError(url); });
}

function bindInfoWindow(marker, htmlContent) {
  const iw = new google.maps.InfoWindow({
    content: `<div style="padding:8px; font-family:'Malgun Gothic',sans-serif; font-size:13px; color:#333;">${htmlContent}</div>`
  });
  marker.addListener("click", () => iw.open(window.ElderlyMapApp.googleMapInstance, marker));
}

function layerDone(name) {
  const app = window.ElderlyMapApp;
  app.loadedCount++;
  updateLoadingText(name);
  if (app.loadedCount >= app.totalLayers) {
    document.getElementById("loadingOverlay").style.display = "none";
    if (app.errors.length > 0) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.innerHTML = `⚠️ <b>누락된 파일 알림:</b> ${app.errors.join(", ")}<br><span style='font-size:11px; color:#aa7700;'>* 무더위쉼터(XML) 외 나머지 CSV 파일들이 준비되면 이 메시지는 사라집니다.</span>`;
    }
    if (window.markerClusterer && window.markerClusterer.MarkerClusterer) {
      const allMarkers = Object.values(app.layerMarkers).flat();
      new markerClusterer.MarkerClusterer({ map: app.googleMapInstance, markers: allMarkers });
    }
  }
}

function updateLoadingText(lastName) {
  const app = window.ElderlyMapApp;
  document.getElementById("loadingText").textContent = lastName
    ? `[${app.loadedCount}/${app.totalLayers}] ${lastName} 데이터 로드 완료...`
    : "데이터를 불러오는 중입니다...";
}
</script>

<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap"></script>

</body>
</html>
