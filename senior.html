<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">노인 안전 지도</title>

<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #f5f6f7;
}

.header-bar {
  width: 800px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.back-btn {
  background-color: #6c757d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.back-btn:hover {
  background-color: #5a6268;
}

#map {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.map-wrapper {
  position: relative;
  width: 800px;
}

.loading-overlay {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  position: absolute;
  top: 0; left: 0;
  z-index: 10;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #eee;
  border-top-color: #e67e22;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text { color: #888; font-size: 14px; }

.legend {
  width: 800px;
  margin-top: 15px;
  background-color: white;
  border-radius: 12px;
  padding: 15px 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.legend h3 {
  margin-top: 0;
  margin-bottom: 12px;
}

.legend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 20px;
}

.legend-item {
  display: flex;
  align-items: center;
}

.legend-item img {
  width: 32px;
  height: 32px;
  margin-right: 12px;
}

.legend-text {
  font-size: 15px;
  color: #333;
}

.error-box {
  width: 800px;
  background: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  color: #856404;
  margin-top: 10px;
  display: none;
}

@media (max-width: 850px) {
  .header-bar, .map-wrapper, #map, .legend, .error-box {
    width: 95%;
  }
  #map { height: 500px; }
  .loading-overlay { width: 100%; }
  .legend-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="header-bar">
  <h2 id="pageTitle">노인 안전 지도</h2>
  <button class="back-btn" id="homeBtn" onclick="location.href='index.html'">🏠 홈으로</button>
</div>

<div class="map-wrapper">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">데이터를 불러오는 중입니다...</div>
  </div>
  <div id="map"></div>
</div>

<div class="error-box" id="errorBox"></div>

<div class="legend">
  <h3 id="legendTitle">📍 지도 마커 안내</h3>
  <div class="legend-grid">

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/7096/7096518.png">
      <div class="legend-text" id="benchText">🪑 벤치·쉼터</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/3050/3050451.png">
      <div class="legend-text" id="toiletText">🚻 화장실</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/4003/4003836.png">
      <div class="legend-text" id="flatroadText">🚶 평지 구간</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991589.png">
      <div class="legend-text" id="elevatorText">🛗 지하철역 승강기</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209158.png">
      <div class="legend-text" id="escalatorText">🔼 지하철역 에스컬레이터</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2780/2780887.png">
      <div class="legend-text" id="rampText">♿ 휠체어 경사로</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">
      <div class="legend-text" id="medicalText">🏥 의료복지시설</div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/1946/1946429.png">
      <div class="legend-text" id="coolshelterText">☀️ 무더위쉼터</div>
    </div>

  </div>
</div>

<script src="language.js"></script>
<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

<script>
const FILES = {
  bench:       "bench.csv",
  toilet:      "toilet_elder.csv",
  flatroad:    "flatroad.csv",
  elevator:    "elevator.csv",
  escalator:   "escalator.csv",
  ramp:        "ramp_elder.csv",
  medical:     "medical.csv",
  coolshelter: "coolshelter.csv",
};

const layerMarkers = {
  bench: [], toilet: [], flatroad: [], elevator: [],
  escalator: [], ramp: [], medical: [], coolshelter: []
};

let map;
let loadedCount = 0;
const totalLayers = Object.keys(FILES).length;
const errors = [];
let ICONS = {}; // 구글 SDK 바인딩 지연 에러를 막기 위해 초기 객체만 비워둠

function makeCircleIcon(color, size = 7) {
  return {
    path: google.maps.SymbolPath.CIRCLE,
    scale: size,
    fillColor: color,
    fillOpacity: 0.88,
    strokeColor: "#fff",
    strokeWeight: 1.5,
  };
}

function initMap() {
  // 구글 맵 API 로드가 완전히 완료된 이 시점에 스타일 서클 객체 빌드 (안전성 확보)
  ICONS = {
    bench:       makeCircleIcon("#ff8f00", 7),
    toilet:      makeCircleIcon("#00838f", 7),
    flatroad:    makeCircleIcon("#66bb6a", 7),
    elevator:    makeCircleIcon("#1e88e5", 8),
    escalator:   makeCircleIcon("#42a5f5", 7),
    ramp:        makeCircleIcon("#7b9ed9", 7),
    medical:     makeCircleIcon("#e53935", 9),
    coolshelter: makeCircleIcon("#ef6c00", 8),
  };

  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 11,
    center: { lat: 37.5665, lng: 126.9780 },
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
  });
  
  loadAllLayers();
}

function loadAllLayers() {
  updateLoadingText();

  // 안전하게 동적 로드된 ICONS 스타일 매핑 연동
  const layers = [
    { key: "bench",       icon: ICONS.bench,       emoji: "🪑", label: "벤치·쉼터",            done: "벤치·쉼터" },
    { key: "toilet",      icon: ICONS.toilet,      emoji: "🚻", label: "화장실",               done: "화장실" },
    { key: "flatroad",    icon: ICONS.flatroad,    emoji: "🚶", label: "평지 구간",             done: "평지 구간" },
    { key: "elevator",    icon: ICONS.elevator,    emoji: "🛗", label: "지하철역 승강기",       done: "승강기" },
    { key: "escalator",   icon: ICONS.escalator,   emoji: "🔼", label: "지하철역 에스컬레이터", done: "에스컬레이터" },
    { key: "ramp",        icon: ICONS.ramp,        emoji: "♿", label: "휠체어 경사로",         done: "경사로" },
    { key: "medical",     icon: ICONS.medical,     emoji: "🏥", label: "의료복지시설",          done: "의료복지시설" },
    { key: "coolshelter", icon: ICONS.coolshelter, emoji: "☀️", label: "무더위쉼터",           done: "무더위쉼터" },
  ];

  layers.forEach(({ key, icon, emoji, label, done }) => {
    loadCSV(FILES[key], (rows) => {
      rows.forEach(({ name, lat, lng }) => {
        addMarker(key, lat, lng, `${emoji} ${name}`, `${label}<br>위도: ${lat.toFixed(6)}<br>경도: ${lng.toFixed(6)}`, icon);
      });
      layerDone(done);
    });
  });
}

function loadCSV(url, callback) {
  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error(url + " 파일 없음");
      return res.text();
    })
    .then(text => {
      const rows = text.trim().split("\n").slice(1);
      const parsed = [];
      for (const row of rows) {
        const cols = row.split(",");
        if (cols.length < 3) continue;
        const lat = parseFloat(cols[1]);
        const lng = parseFloat(cols[2]);
        if (isNaN(lat) || isNaN(lng)) continue;
        parsed.push({ name: cols[0].trim(), lat, lng });
      }
      const CHUNK = 2000;
      let idx = 0;
      function next() {
        callback(parsed.slice(idx, idx + CHUNK));
        idx += CHUNK;
        if (idx < parsed.length) setTimeout(next, 0);
      }
      next();
    })
    .catch(err => {
      console.warn(err);
      errors.push(url);
      layerDone(url);
    });
}

function addMarker(layer, lat, lng, title, infoHTML, icon) {
  const marker = new google.maps.Marker({
    position: { lat, lng },
    map: map,
    title: title,
    icon: icon,
    visible: true,
  });
  const iw = new google.maps.InfoWindow({
    content: `<div style="padding:10px; font-family:'Malgun Gothic',sans-serif; color:#333; font-size:13px;">
                <strong>${title}</strong><br>
                <span style="color:#888; font-size:12px;">${infoHTML}</span>
              </div>`
  });
  marker.addListener("click", () => iw.open(map, marker));
  layerMarkers[layer].push(marker);
}

function layerDone(name) {
  loadedCount++;
  updateLoadingText(name);
  if (loadedCount >= totalLayers) {
    document.getElementById("loadingOverlay").style.display = "none";
    if (errors.length > 0) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.innerHTML = `⚠️ 아래 파일을 찾을 수 없어요. HTML과 같은 폴더에 있는지 확인해주세요!<br><b>${errors.join(", ")}</b>`;
    }

    // [성능 조율] 비동기 대용량 분할 로드가 완료된 마커 전체를 마커 클러스터러에 주입
    if (window.markerClusterer && window.markerClusterer.MarkerClusterer) {
      const allMarkers = Object.values(layerMarkers).flat();
      new markerClusterer.MarkerClusterer({ map, markers: allMarkers });
    }
  }
}

function updateLoadingText(lastName) {
  document.getElementById("loadingText").textContent = lastName
    ? `[${loadedCount}/${totalLayers}] ${lastName} 데이터 로드 완료...`
    : "데이터를 불러오는 중입니다...";
}

// 브라우저가 화면 요소 구조(DOM)를 모두 렌더링한 직후 다국어 번역을 안전하게 주입
document.addEventListener("DOMContentLoaded", function() {
  if (typeof applyLanguage === "function") {
    applyLanguage("elder");
  }
});
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCI0T40-yOZbntAKSaGCQcKv_10qUVqZdE&callback=initMap">
</script>

</body>
</html>
