<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">일반(성인) 안전 지도</title>

<style>
body {
  font-family: 'Malgun Gothic', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: #f5f6f7;
}

.header-bar {
  width: 800px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.back-btn {
  background-color: #6c757d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.back-btn:hover {
  background-color: #5a6268;
}

#map {
  width: 800px;
  height: 550px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.legend {
  width: 800px;
  margin-top: 15px;
  background-color: white;
  border-radius: 12px;
  padding: 15px 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.legend h3 {
  margin-top: 0;
  margin-bottom: 12px;
}

.legend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 20px;
}

.legend-item {
  display: flex;
  align-items: center;
}

.legend-item img {
  width: 32px;
  height: 32px;
  margin-right: 12px;
}

.legend-text {
  font-size: 15px;
  color: #333;
}

@media (max-width: 850px) {
  .header-bar,
  #map,
  .legend {
    width: 95%;
  }

  #map {
    height: 500px;
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header-bar">

  <h2 id="pageTitle">일반(성인) 안전 지도</h2>

  <button class="back-btn"
    id="homeBtn"
    onclick="location.href='index.html'">
    🏠 홈으로
  </button>

</div>

<div id="map"></div>

<!-- ✅ 범례 -->
<div class="legend">

  <h3 id="legendTitle">📍 지도 마커 안내</h3>

  <div class="legend-grid">

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149852.png">
      <div class="legend-text" id="cctvText">
        📷 CCTV 설치 위치
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png">
      <div class="legend-text" id="streetText">
        💡 가로등 위치
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
      <div class="legend-text" id="crowdHighText">
        👥 유동인구 많은 곳
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/854/854878.png">
      <div class="legend-text" id="crowdLowText">
        🚶 유동인구 적은 곳
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/296/296216.png">
      <div class="legend-text" id="accidentText">
        🚗 교통사고 다발 구역
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/565/565547.png">
      <div class="legend-text" id="crimeText">
        ⚠️ 범죄 발생 구역
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2785/2785482.png">
      <div class="legend-text" id="hospitalText">
        🏥 병원
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2776/2776067.png">
      <div class="legend-text" id="fireText">
        🚒 소방서
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
      <div class="legend-text" id="policeText">
        👮 경찰서
      </div>
    </div>

    <div class="legend-item">
      <img src="https://cdn-icons-png.flaticon.com/512/619/619153.png">
      <div class="legend-text" id="shelterText">
        🏠 지킴이집
      </div>
    </div>

  </div>

</div>

<script>
let map;

function initMap() {

  map = new google.maps.Map(
