<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">장애인 안전 지도</title>

<style>
body {
    font-family: 'Malgun Gothic', sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f5f6f7;
}

.header-bar {
    width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.back-btn {
    background-color: #6c757d;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.back-btn:hover {
    background-color: #5a6268;
}

#map {
    width: 800px;
    height: 550px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.legend {
    width: 800px;
    margin-top: 15px;
    background-color: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.legend h3 {
    margin-top: 0;
    margin-bottom: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

.legend-item img {
    width: 32px;
    height: 32px;
    margin-right: 12px;
}

.legend-text {
    font-size: 15px;
    color: #333;
}

@media (max-width: 850px) {

    .header-bar,
    #map,
    .legend {
        width: 95%;
    }

    #map {
        height: 500px;
    }

}
</style>
</head>

<body>

<div class="header-bar">

    <h2 id="mapTitle">장애인 안전 지도</h2>

    <button
        class="back-btn"
        id="homeBtn"
        onclick="location.href='index.html'">
        🏠 홈으로
    </button>

</div>

<div id="map"></div>

<div class="legend">

    <h3 id="legendTitle">📍 지도 마커 안내</h3>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png">
        <div class="legend-text" id="streetText">
            💡 가로등 위치
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/3063/3063822.png">
        <div class="legend-text" id="facilityText">
            ♿ 장애인 편의시설
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">
        <div class="legend-text" id="benchText">
            🪑 벤치 및 휴식 공간
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1684/1684375.png">
        <div class="legend-text" id="shelterText">
            🧊 무더위쉼터
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
        <div class="legend-text" id="crowdHighText">
            👥 유동인구 밀집지역
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946436.png">
        <div class="legend-text" id="crowdLowText">
            🌿 유동인구 적은 지역
        </div>
    </div>

    <div class="legend-item">
        <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
        <div class="legend-text" id="accidentText">
            ⚠️ 교통사고 다발구역
        </div>
    </div>

</div>

<script>

function initMap() {

    const defaultCenter = {
        lat: 37.566535,
        lng: 126.977969
    };

    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 13,
            center: defaultCenter
        }
    );

    const bounds = new google.maps.LatLngBounds();

    const streetLights = [
        { title: "가로등 위치 A", lat: 37.5668, lng: 126.9785 },
        { title: "가로등 위치 B", lat: 37.5682, lng: 126.9761 }
    ];

    streetLights.forEach(place => {

        const marker = new google.maps.Marker({
            position: {
                lat: place.lat,
                lng: place.lng
            },
            map: map,
            title: place.title,
            icon: {
                url: "https://cdn-icons-png.flaticon.com/512/869/869869.png",
                scaledSize: new google.maps.Size(38, 38)
            }
        });

        const infowindow = new google.maps.InfoWindow({
            content: `
                <div style="padding:10px;">
                    <strong>💡 ${place.title}</strong><br>
                    야간 보행 안전을 위한 가로등입니다.
                </div>
            `
        });

        marker.addListener("click", () => {
            infowindow.open(map, marker);
        });

        bounds.extend(marker.getPosition());

    });

    if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
    }

}
</script>

<script src="language.js"></script>

<script>
applyLanguage("disabled");
</script>

<!-- ✅ 구글 맵 API -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
